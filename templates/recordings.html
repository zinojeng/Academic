{% extends 'layout.html' %}
{% block content %}
<h1>Recordings</h1>
<table class="table">
  <thead>
    <tr><th>ID</th><th>File</th><th></th></tr>
  </thead>
  <tbody>
    {% for rec in recordings %}
    <tr>
      <td>{{ rec.id }}</td>
      <td>{{ rec.filename }}</td>
      <td><a class="btn btn-sm btn-secondary" href="{{ url_for('recording_detail', rec_id=rec.id) }}">View</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
